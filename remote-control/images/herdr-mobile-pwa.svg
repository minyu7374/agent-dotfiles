<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="340" viewBox="0 0 1080 340" role="img" aria-labelledby="title desc"><title id="title">两个网页入口通过 SSH 反向转发接入同一 Web relay</title><desc id="desc">家用和 VPS 浏览器入口分别经 Nginx 与 SSH 隧道访问本机同一 Web relay，不需要额外 gateway。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3568a4"/></marker><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#203248}.title{font-size:23px;font-weight:600}.label{font-size:18px;font-weight:600}.detail{font-size:15px;fill:#4d6279}.node{fill:#f7f9fc;stroke:#9cb5d0;stroke-width:1.5}.edge{fill:none;stroke:#3568a4;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1080" height="340" fill="white"/><text x="540" y="38" text-anchor="middle" class="title">Herdr Web：网页与 relay 使用配套发布包</text><rect x="20" y="115" width="220" height="128" rx="14" class="node"/><text x="130.0" y="147" text-anchor="middle" class="label">浏览器 / PWA</text><text x="130.0" y="175" text-anchor="middle" class="detail">HTTPS / WSS</text><text x="130.0" y="203" text-anchor="middle" class="detail">共享 Web 设备状态</text><rect x="380" y="115" width="280" height="128" rx="14" class="node"/><text x="520.0" y="147" text-anchor="middle" class="label">家用 / VPS 网页中转</text><text x="520.0" y="175" text-anchor="middle" class="detail">Nginx · 443</text><text x="520.0" y="203" text-anchor="middle" class="detail">127.0.0.1:18377 / 18379</text><rect x="800" y="87" width="260" height="184" rx="14" class="node"/><text x="930.0" y="119" text-anchor="middle" class="label">Codex 运行本机</text><text x="930.0" y="147" text-anchor="middle" class="detail">网页 + Web relay · 8377</text><text x="930.0" y="175" text-anchor="middle" class="detail">事件 UDP · 8378</text><text x="930.0" y="203" text-anchor="middle" class="detail">Herdr / Codex</text><text x="930.0" y="231" text-anchor="middle" class="detail">无公网 IP</text><path d="M240 179H380" class="edge"/><path d="M660 179H800" class="edge"/><text x="310" y="105" text-anchor="middle" class="detail">专用域名</text><text x="730" y="105" text-anchor="middle" class="detail">SSH 隧道</text><text x="540" y="312" text-anchor="middle" class="detail">同源提供页面与 /ws；与原生 App relay 分别维护端口、身份和凭据</text></svg>
